# Conditions for the 4 San Francisco relief programs, transcribed from
# rental_relief_program_bulletins.raw_bulletin_text. Edit here, not in code.
#
# Condition types (evaluated in tools/relief.py):
#   residential_tenant      tenant rents a residential unit
#   income_max_pct_ami      household income <= value % of Area Median Income
#   own_open_dbi_case       an open DBI habitability case covers THE TENANT'S UNIT
#                           (block-level 311 evidence alone never satisfies this)
#   hazard_in               tenant reports one of the listed hazards
#   medical_or_wage_loss    acute medical leave or wage loss
#   facing_eviction         an unlawful detainer / eviction case is pending

# 2026 SF MOHCD income limits (sample tiers), annual USD by household size.
# Published limits are compared directly (they are rounded, so we don't scale 100%).
# Household sizes not listed -> income stays "to confirm" (never guessed).
# TODO before the demo: verify these figures against the official MOHCD chart.
income_limits_source: "2026 SF MOHCD Income Limits (sample tiers), provided by team"
income_limits_usd:
  60:  {1: 68050,  2: 77800,  3: 87550,  4: 97250}
  80:  {1: 90750,  2: 103750, 3: 116700, 4: 129700}
  100: {1: 113450, 2: 129700, 3: 145900, 4: 162100}
  120: {1: 136150, 2: 155650, 3: 175100, 4: 194500}
  148: {1: 167900, 2: 191950, 3: 215950, 4: 239900}
  200: {1: 226900, 2: 259400, 3: 291800, 4: 324200}

programs:
  BUL-CA-02:
    short_name: Prop F Right to Counsel
    amount: full eviction defense lawyer + up to $6,000 stipulation bridge
    category: legal_defense
    conditions:
      - {type: residential_tenant}
      - {type: own_open_dbi_case}
      - {type: facing_eviction}
  BUL-CA-01:
    short_name: SF ERAP
    amount: up to $12,000 over six months of back rent or move-in deposit
    category: cash
    conditions:
      - {type: residential_tenant}
      - {type: income_max_pct_ami, value: 80}
  BUL-CA-03:
    short_name: MEDA Family Stabilization Grant
    amount: up to $7,500 back rent + PG&E shutoff prevention
    category: cash
    conditions:
      - {type: residential_tenant}
      - {type: income_max_pct_ami, value: 60}
      - {type: medical_or_wage_loss}
  BUL-CA-04:
    short_name: DBI Relocation & Mold Remediation Bridge
    amount: up to $8,500 temporary hotel / relocation stipend
    category: relocation
    conditions:
      - {type: residential_tenant}
      - {type: own_open_dbi_case}
      - {type: hazard_in, value: [heat, sewage, mold]}
